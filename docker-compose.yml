# Bifrost development stack — PostgreSQL 16 with pgvector
# Usage: docker compose up -d && alembic upgrade head

services:
  postgres:
    # Pinned: review/batch-1 — floating ``pg16`` lets the upstream
    # tag move under us. Bump intentionally when adopting a new
    # pgvector release; keep CI (pr-check.yml) in sync.
    image: pgvector/pgvector:0.8.0-pg16
    container_name: bifrost-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bifrost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bifrost_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bifrost}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
