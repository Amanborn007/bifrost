# Pre-commit hooks — local-machine version of CI gates.
#
# Setup:
#   uv pip install pre-commit
#   pre-commit install
#
# Run on demand:
#   pre-commit run --all-files
#
# These mirror what runs in .github/workflows/pr-check.yml so the
# fastest feedback loop is local. Keep versions in sync with CI when
# bumping.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-browser-automation
        name: No browser automation in src/
        entry: bash -c 'grep -rEn "(import|from)\s+(puppeteer|playwright|selenium|webdriver|browser_use|pyppeteer|splinter|undetected_chromedriver)\b" src/ scripts/ 2>/dev/null && exit 1 || exit 0'
        language: system
        pass_filenames: false
        # Mirrors the CI gate in pr-check.yml ``no-browser-automation``.
