apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: webhook-api
  description: Event ingest and subscription CRUD for AcmeCo webhooks
  labels:
    region: us-eu
  annotations:
    github.com/project-slug: acmeco/webhook-api
    acmeco.example/tier: "1"
    acmeco.example/regions: "us,eu"
spec:
  type: service
  lifecycle: production
  owner: group:default/dlvr
  system: webhook-delivery
  dependsOn:
    - component:default/dispatcher
